apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: clickhouse
    orgId: 1
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: app
      defaultDatabase: analytics
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
