global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: gateway
    static_configs:
      - targets:
          - gateway:1234

  - job_name: usage-source
    static_configs:
      - targets:
          - usage-source:9469
