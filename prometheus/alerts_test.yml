rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'agent_rate_limit_reset_timestamp_seconds{provider="claude_code",limit="subscription",bucket="five_hour",window="5h"}'
        values: '18000+0x60'
      - series: 'agent_rate_limit_window_seconds{provider="claude_code",limit="subscription",bucket="five_hour",window="5h"}'
        values: '18000+0x60'
    promql_expr_test:
      - expr: agent_rate_limit_linear_budget_ratio
        eval_time: 1h
        exp_samples:
          - labels: 'agent_rate_limit_linear_budget_ratio{provider="claude_code",limit="subscription",bucket="five_hour",window="5h"}'
            value: 0.2

  - interval: 1m
    input_series:
      - series: 'agent_rate_limit_used_ratio{provider="claude_code",limit="subscription",bucket="five_hour",window="5h"}'
        values: '0.25+0x65'
      - series: 'agent_rate_limit_reset_timestamp_seconds{provider="claude_code",limit="subscription",bucket="five_hour",window="5h"}'
        values: '18000+0x65'
      - series: 'agent_rate_limit_window_seconds{provider="claude_code",limit="subscription",bucket="five_hour",window="5h"}'
        values: '18000+0x65'
    alert_rule_test:
      - eval_time: 1h5m
        alertname: AgentRateLimitPaceHigh
        exp_alerts:
          - exp_labels:
              provider: claude_code
              limit: subscription
              bucket: five_hour
              window: 5h
              severity: warning
            exp_annotations:
              summary: "claude_code 5h usage is ahead of budget"
              description: "Usage is above the linear budget for the current provider-defined reset window."

  - interval: 1m
    input_series:
      - series: 'gateway_errors_total{instance="gateway:1234",job="gateway"}'
        values: '0 0 0 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: GatewayKafkaDeliveryError
        exp_alerts:
          - exp_labels:
              instance: gateway:1234
              job: gateway
              severity: critical
              service: gateway
            exp_annotations:
              summary: "Gateway failed to deliver an event to Kafka"
              description: "The gateway observed at least one Kafka enqueue or delivery error during the last five minutes."

  - interval: 1m
    input_series:
      - series: 'up{instance="usage-source:9469",job="usage-source"}'
        values: '1 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: EventPipelineTargetDown
        exp_alerts:
          - exp_labels:
              instance: usage-source:9469
              job: usage-source
              severity: critical
              service: usage-source
            exp_annotations:
              summary: "usage-source is unavailable"
              description: "Prometheus has been unable to scrape usage-source for more than one minute."
