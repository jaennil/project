groups:
  - name: agent-rate-limits
    rules:
      - record: agent_rate_limit_linear_budget_ratio
        expr: |
          clamp(
            (
              time()
              - (
                agent_rate_limit_reset_timestamp_seconds
                - agent_rate_limit_window_seconds
              )
            )
            / agent_rate_limit_window_seconds,
            0,
            1
          )

      - alert: AgentRateLimitPaceHigh
        expr: |
          (
            agent_rate_limit_used_ratio
            > on (provider, limit, bucket, window)
            agent_rate_limit_linear_budget_ratio
          )
          and on (provider, limit, bucket, window)
          (agent_rate_limit_reset_timestamp_seconds > time())
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.provider }} {{ $labels.window }} usage is ahead of budget"
          description: "Usage is above the linear budget for the current provider-defined reset window."

      - alert: AgentRateLimitCritical
        expr: |
          (agent_rate_limit_used_ratio >= 0.95)
          and on (provider, limit, bucket, window)
          (agent_rate_limit_reset_timestamp_seconds > time())
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.provider }} {{ $labels.window }} limit is above 95%"
          description: "The {{ $labels.limit }} {{ $labels.bucket }} limit is nearly exhausted."

  - name: event-pipeline
    rules:
      - alert: GatewayKafkaDeliveryError
        expr: increase(gateway_errors_total[5m]) > 0
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "Gateway failed to deliver an event to Kafka"
          description: "The gateway observed at least one Kafka enqueue or delivery error during the last five minutes."

      - alert: EventPipelineTargetDown
        expr: up{job=~"gateway|usage-source"} == 0
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for more than one minute."
