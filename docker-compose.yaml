services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        CONTROLLER://:29093,
        INTERNAL://:19092,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.28.1
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-app}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tuna:
    image: yuccastream/tuna:0.34.2
    container_name: tuna-project-ai-usage
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    entrypoint: ["/bin/sh", "/usr/local/bin/tuna-watchdog.sh"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      TUNA_WATCHDOG_URL: >-
        https://project-ai-usage.ru.tuna.am/api/v1/status/buildinfo
      TUNA_WATCHDOG_INTERVAL: "${TUNA_WATCHDOG_INTERVAL:-60}"
      TUNA_WATCHDOG_FAILURE_THRESHOLD: >-
        ${TUNA_WATCHDOG_FAILURE_THRESHOLD:-3}
    volumes:
      - "${HOME}/.config/tuna/tuna.yml:/etc/tuna.yml:ro"
      - "./tuna/watchdog.sh:/usr/local/bin/tuna-watchdog.sh:ro"
    command:
      - --config=/etc/tuna.yml
      - --log=stdout
      - --no-colors
      - http
      - 127.0.0.1:9090
      - --subdomain=project-ai-usage
      - --location=ru
      - --cidr-allow=${GRAFANA_SERVER_CIDR:-188.32.5.65/32}
      - --https-redirect
      - --inspect=false

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-1234}:1234"
    environment:
      KAFKA_BROKERS: kafka:19092

  usage-source:
    build:
      context: ./usage-source
      args:
        APP_UID: "${LOCAL_UID:-1000}"
        APP_GID: "${LOCAL_GID:-1000}"
    container_name: usage-source
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      GATEWAY_URL: http://gateway:1234/events
      CODEX_SESSIONS_DIR: /sessions/codex
      CLAUDE_PROJECTS_DIR: /sessions/claude
      STATE_DIR: /var/lib/usage-source
      SCAN_INTERVAL: "${USAGE_SCAN_INTERVAL:-2s}"
      WORKERS: "${USAGE_WORKERS:-8}"
      BACKFILL: "${USAGE_BACKFILL:-true}"
      HTTP_ADDR: :9469
    ports:
      - "127.0.0.1:${USAGE_SOURCE_PORT:-9469}:9469"
    volumes:
      - "${HOME}/.codex/sessions:/sessions/codex:ro"
      - "${HOME}/.claude/projects:/sessions/claude:ro"
      - usage-source-data:/var/lib/usage-source

  processor:
    build:
      context: ./processor
    container_name: processor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "${PROCESSOR_PORT:-1235}:1235"
    environment:
      KAFKA_BROKERS: kafka:19092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-app}"


volumes:
  kafka-data:
  clickhouse-data:
  clickhouse-logs:
  prometheus-data:
  usage-source-data:
