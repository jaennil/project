events {}

http {
    access_log off;

    server {
        listen 127.0.0.1:9191;

        location = /healthz {
            return 204;
        }

        location /api/v1/ {
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:8123;
            proxy_set_header Host $host;
        }
    }
}
