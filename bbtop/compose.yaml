services:
  bbtop:
    build: .
    command: ["--no-tui", "--listen", "0.0.0.0:9099"]
    environment:
      BBTOP_PROC_ROOT: /host/proc
      BBTOP_FILESYSTEM_ROOT: /host/root
      BBTOP_RUNTIME_ROOT: /host/run/bbtop
    pid: host
    ports:
      - "127.0.0.1:9099:9099"
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/bbtop:/host/run/bbtop:ro

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      - bbtop
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: bbtop
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
  prometheus-data:
